{% extends "base.html" %}

{% block title %}Edit Score — KM Tracker{% endblock %}
{% block back %}<a class="back-link" href="{{ url_for('scores') }}">← Scores</a>{% endblock %}
{% block heading %}Edit Score{% endblock %}

{% block content %}
<form class="form card" method="post" action="{{ url_for('update_score', score_id=score.id) }}">
    <p class="muted">Cup ID: {{ score.cup_id }} · Player ID: {{ score.player_id }}</p>
    <div class="field">
        <label for="score-input">Score</label>
        <input type="number" id="score-input" name="score" value="{{ score.score }}" required>
    </div>
    <label class="check"><input type="checkbox" name="won_tiebreaker" {{ 'checked' if score.won_tiebreaker else '' }}> Won tiebreaker</label>
    <div class="field-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" href="{{ url_for('scores') }}">Cancel</a>
    </div>
</form>
{% endblock %}
