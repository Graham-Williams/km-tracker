{% extends "base.html" %}

{% block title %}Edit Player — KM Tracker{% endblock %}
{% block back %}<a class="back-link" href="{{ url_for('players') }}">← Players</a>{% endblock %}
{% block heading %}Edit Player{% endblock %}

{% block content %}
<form class="form card" method="post" action="{{ url_for('update_player', player_id=player.id) }}">
    <div class="field">
        <label for="name-input">Name</label>
        <input type="text" id="name-input" name="name" value="{{ player.name }}" maxlength="30" required>
    </div>
    <label class="check"><input type="checkbox" name="has_line" id="has-line" {{ 'checked' if player.has_line else '' }}> Plays with a line</label>
    <div class="field" id="line-fields" style="{{ '' if player.has_line else 'display:none;' }}">
        <label for="line-input">Line</label>
        <input type="number" name="line" id="line-input" value="{{ player.line }}">
        <p class="muted">Lines auto-adjust after 3-player cups.</p>
    </div>
    <label class="check"><input type="checkbox" name="default_cup" {{ 'checked' if player.default_cup else '' }}> Default on new cups</label>
    <div class="field">
        <label for="character-wii">Default character — Wii</label>
        <select name="default_character_wii" id="character-wii">
            <option value="">None</option>
            {% for character in wii_characters %}
            <option value="{{ character }}" {% if character == player.default_character_wii %}selected{% endif %}>{{ character }}</option>
            {% endfor %}
        </select>
        <p class="muted">Used to match this player on photo score entry.</p>
    </div>
    <div class="field">
        <label for="character-switch">Default character — Switch</label>
        <select name="default_character_switch" id="character-switch">
            <option value="">None</option>
            {% for character in switch_characters %}
            <option value="{{ character }}" {% if character == player.default_character_switch %}selected{% endif %}>{{ character }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" href="{{ url_for('players') }}">Cancel</a>
    </div>
</form>

<script>
    document.getElementById("has-line").addEventListener("change", function() {
        document.getElementById("line-fields").style.display = this.checked ? "" : "none";
    });
</script>
{% endblock %}
