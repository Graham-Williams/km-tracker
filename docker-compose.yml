services:
  app:
    build: .
    # No host port is published. The cloudflared connector reaches the app over
    # the compose network at http://app:8080, so nothing needs to be exposed on
    # the host. Publishing 8080 on the host would bypass Cloudflare Access on the
    # LAN. For local debugging only you could add `- "127.0.0.1:8080:8080"` under
    # a `ports:` block, but the tunnel does not need it.
    volumes:
      - ./data:/data
    environment:
      # Explicit for clarity — "production" is also the app's default when unset.
      - APP_ENV=production
      - DB_PATH=/data/km_tracker.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      # Optional — photo score extraction. Blank/unset disables the feature
      # gracefully (attach-only photo mode; manual entry unaffected).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Cloudflare Access hardening (issue #20). Empty-safe defaults so the base
      # file works standalone in dev: blank CF_ACCESS_* disables app-side JWT
      # verification (intended dev fallback). docker-compose.access.yml still
      # layers the real prod values on top — don't pin the prod host here.
      - APP_HOST=${APP_HOST:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set}
    restart: unless-stopped
    depends_on:
      - app
